server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # URLs limpas: /ds → ds.html, /fio-start → fio-start.html
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  location ~* \.md$ {
    default_type text/plain;
    charset utf-8;
  }

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}
