# Blueprint Render — Gestão Oficina de Valor (API + Postgres + Web estático opcional)
databases:
  - name: oficina-valor-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: oficina-valor-api
    runtime: docker
    plan: free
    rootDir: oficina-valor
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oficina-valor-db
          property: connectionString
      - key: PORT
        value: "3001"
      - key: AUTH_MODE
        value: dev
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: NAO_SYNC_URL
        value: ""

  - type: web
    name: oficina-valor-web
    runtime: static
    rootDir: oficina-valor/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - oficina-valor/web/**
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_NAO_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
