server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Evita HTTP 206 (Range) — proxies/port-forward quebram ES modules e geram tela branca.
  max_ranges 0;
  add_header Accept-Ranges none always;

  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
    add_header Accept-Ranges none always;
  }
}
