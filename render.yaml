# Blueprint Render — Plataforma IA Industrial (checklist SPA)
# https://dashboard.render.com/blueprints
#
# Static site: Vite build em web/dist
# Sync Nao no Render: use download do pack (API local só no Docker).

services:
  - type: web
    name: plataforma-ia-industrial
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - web/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
