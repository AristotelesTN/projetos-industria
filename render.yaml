# Blueprint Render — checklist SPA + Nao (analytics agent)

services:
  - type: web
    name: plataforma-ia-nao
    runtime: docker
    plan: free
    dockerfilePath: ./docker/nao/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NAO_CONTEXT_SOURCE
        value: local
      - key: NAO_DEFAULT_PROJECT_PATH
        value: /app/project
      - key: BETTER_AUTH_URL
        value: https://plataforma-ia-nao.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false

  - type: web
    name: plataforma-ia-industrial
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - web/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
